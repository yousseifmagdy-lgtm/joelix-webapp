<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refreshing Joelix</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1e9; color: #161616; font: 700 16px/1.5 system-ui, sans-serif; }
      main { width: min(86vw, 28rem); padding: 2rem; border: 3px solid; box-shadow: 8px 8px 0 #161616; background: #fff; text-align: center; }
    </style>
  </head>
  <body>
    <main>Refreshing Joelix…</main>
    <script>
      (async () => {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith("joelix-game-")).map((key) => caches.delete(key)));
        }
        location.replace("/?refreshed=1");
      })().catch(() => location.replace("/?refreshed=1"));
    </script>
  </body>
</html>
